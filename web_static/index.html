<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Hemköpdle</title>
    <script src="/script.js" defer></script>
</head>
<body>
    <navbar>
        <div class="icon-button" id="hamburger-button" onclick="open_mode_picker()">
            <img src="/icons/hamburger.svg" alt="Hamburger" width="30" height="30">
        </div>
        <a href="/" id="logo">
            <img src="Hemköpdle logo.svg" alt="Hemköpdle logo" width="173" height="24">
        </a>
        <div id="external-links">
            <a href="https://www.youtube.com/watch?v=GIhcL8K4shg" target="_blank" class="icon-button">
                <img src="/icons/support.svg" alt="Support" width="30" height="30">
            </a>
            <a href="https://ebinbellini.com/" target="_blank" class="icon-button primary">
                <img src="/icons/web.svg" alt="Ebin Bellini" width="30" height="30">
            </a>
        </div>
        <div id="mode-picker">
            <div class="mode-picker-title">Välj läge</div>
            <div id="close-button" class="icon-button" onclick="close_mode_picker()">
                <img src="/icons/close.svg" alt="Stäng" width="30" height="30">
            </div>
            <a href="/dagens">
                <div class="cool-button">
                    <img src="/icons/calendar.svg" alt="Dagens vara" width="30" height="30">
                    <span>Dagens vara</span>
                </div>
            </a>
            <a href="/slump">
                <div class="cool-button">
                    <img src="/icons/cart.svg" alt="Slump" width="30" height="30">
                    <span>Jag har tur</span>
                </div>
            </a>
            <a href="/strid">
                <div class="cool-button">
                    <img src="/icons/fight.svg" alt="Strid" width="30" height="30">
                    <span>Kund mot kund</span>
                </div>
            </a>
        </div>
    </navbar>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <title>Hemköpdle - Dagens vara</title>
    <script src="/script.js" defer></script>
</head>
<body>
    <navbar>
        <div class="icon-button" id="hamburger-button" onclick="open_mode_picker()">
            <img src="/icons/hamburger.svg" alt="Hamburger" width="30" height="30">
        </div>
        <a href="/" id="logo">
            <img src="Hemköpdle logo.svg" alt="Hemköpdle logo" width="173" height="24">
        </a>
        <div id="external-links">
            <a href="https://www.youtube.com/watch?v=GIhcL8K4shg" target="_blank" class="icon-button">
                <img src="/icons/support.svg" alt="Support" width="30" height="30">
            </a>
            <a href="https://ebinbellini.com/" target="_blank" class="icon-button primary">
                <img src="/icons/web.svg" alt="Ebin Bellini" width="30" height="30">
            </a>
        </div>
        <div id="mode-picker">
            <div class="mode-picker-title">Välj läge</div>
            <div id="close-button" class="icon-button" onclick="close_mode_picker()">
                <img src="/icons/close.svg" alt="Stäng" width="30" height="30">
            </div>
            <a href="/">
                <div class="cool-button">
                    <img src="/icons/calendar.svg" alt="Dagens vara" width="30" height="30">
                    <span>Dagens vara</span>
                </div>
            </a>
            <a href="/slump">
                <div class="cool-button">
                    <img src="/icons/cart.svg" alt="Slump" width="30" height="30">
                    <span>Jag har tur</span>
                </div>
            </a>
            <a href="/strid">
                <div class="cool-button">
                    <img src="/icons/fight.svg" alt="Strid" width="30" height="30">
                    <span>Kund mot kund</span>
                </div>
            </a>
        </div>
    </navbar>

    <main class="daily-game">
        <header class="game-header">
            <h1>Dagens vara</h1>
            <p>
                Gissa priset! Du har <strong>6</strong> försök och inom <strong>50 öre</strong>
                räknas som rätt.
            </p>
        </header>

        <p class="game-status" id="game-status">Laddar dagens vara…</p>

        <article class="product-card" id="product-card" hidden>
            <div class="product-image">
                <img id="product-image" src="" alt="">
            </div>
            <div class="product-details">
                <span class="product-brand" id="product-brand"></span>
                <h2 class="product-name" id="product-name"></h2>
                <span class="product-amount" id="product-amount"></span>
            </div>
        </article>

        <form class="guess-form" id="guess-form" autocomplete="off" hidden>
            <label class="guess-label" for="guess-input">Vad kostar varan?</label>
            <div class="guess-row">
                <div class="guess-field">
                    <input id="guess-input" name="guess" type="text" inputmode="decimal"
                           spellcheck="false" placeholder="0,00" aria-label="Pris i kronor">
                    <span class="guess-unit">kr</span>
                </div>
                <button class="guess-submit" id="guess-submit" type="submit">Gissa</button>
            </div>
            <p class="guess-error" id="guess-error" hidden></p>
        </form>

        <div class="attempts" id="attempts" hidden></div>

        <div class="feedback" id="feedback" hidden></div>

        <ol class="guess-history" id="guess-history"></ol>

        <div class="answer" id="answer" hidden></div>
    </main>
</body>
</html>
